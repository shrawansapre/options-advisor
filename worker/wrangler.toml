name = "api"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV cache for market data (survives isolate eviction unlike in-memory Map)
# To enable:
#   1. npx wrangler kv namespace create MARKET_CACHE
#   2. Uncomment and fill in the id from the output above
# [[kv_namespaces]]
# binding = "MARKET_CACHE"
# id = "<paste-namespace-id-here>"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
